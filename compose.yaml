services:
  falkordb:
    image: falkordb/falkordb:v4.16.3
    ports:
      - "127.0.0.1:6379:6379"
      - "127.0.0.1:3002:3000"
    volumes:
      - aftershock-data:/var/lib/falkordb/data
    environment:
      REDIS_ARGS: "--appendonly yes --appendfsync everysec"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
  graphrag-worker:
    profiles: ["graphrag"]
    build:
      context: .
      dockerfile: python/Dockerfile
    image: aftershock-graphrag:1.4.0
    environment:
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
      FALKORDB_PASSWORD: ${FALKORDB_PASSWORD:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
    volumes:
      - aftershock-models:/models
    mem_limit: 3g
    cpus: 2
volumes:
  aftershock-data:
  aftershock-models:
